<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфоліо команди</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&family=Oswald:wght@600&display=swap">
<style>
/* Layout: a manila folder on a night desk, sized to the viewport. Folder tabs switch Люди / Проєкти.
   Люди: index-card roster | personnel sheet on cardboard (scrolls inside, torn edge at the very end) | teal bookmarks tucked behind.
   Проєкти: selected-project card + a cork board where project cards are dragged freely. Single paper look by design. */
:root {
  color-scheme: light;
  /* scene */
  --night: #0b1118;
  --night-2: #142029;
  --lamp: rgba(255, 186, 102, .18);
  /* paper & folder */
  --paper: #fbf7ec;
  --paper-2: #f2ead6;
  --paper-3: #e9dec2;
  --manila: #e5cd95;
  --manila-2: #b99a5f;
  --manila-edge: #b2945a;
  --card: #c9a86a;
  --card-2: #b8945a;
  --card-edge: #7d5f30;
  --cork: #a9784a;
  --cork-frame: #4a3020;
  /* ink */
  --ink: #25211b;
  --ink-2: #5d5444;
  --ink-3: #8a7f69;
  --rule: #ddd1b6;
  --line-blue: #cfdbe8;
  --red: #ad3326;
  --blue: #23428a;
  --note-ink: #23305a;
  --green: #3c6a33;
  --amber: #8b5a10;
  --pin: #c8261f;
  --clip: #9a978f;
  /* sticky notes */
  --sticky-y: #f1dc7c;
  --sticky-g: #c4e2a6;
  --sticky-p: #f2bcb6;
  /* bookmarks */
  --teal-1: #4b8a8e;
  --teal-2: #41797e;
  --teal-3: #386c71;
  --teal-4: #305f63;
  --teal-lite: #7fbcbc;
  /* project label colors */
  --l0-bg: #e4e9f2; --l0-fg: #2b4a8c;
  --l1-bg: #e3ecdc; --l1-fg: #3c6a33;
  --l2-bg: #f2e5cc; --l2-fg: #8b5a10;
  --l3-bg: #f3dfd9; --l3-fg: #ad3326;
  --l4-bg: #e9e2ef; --l4-fg: #5b3c86;
  --l5-bg: #dcebea; --l5-fg: #2c6b6a;
  /* textures */
  --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .26  0 0 0 0 .16  0 0 0 .09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --cork-tex: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .14  0 0 0 0 .05  0 0 0 .55 -.08'/></filter><rect width='100%25' height='100%25' filter='url(%23c)'/></svg>");
  --torn: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='8' viewBox='0 0 240 8' preserveAspectRatio='none'><path d='M0,0 L0,4 L6,4 L10,2 L15,4 L17,3 L19,5 L24,4 L29,3 L35,4 L37,4 L42,4 L45,5 L48,3 L51,6 L54,3 L56,2 L59,4 L62,3 L66,5 L69,4 L72,4 L77,4 L79,5 L84,3 L87,4 L89,5 L93,2 L99,5 L101,4 L105,4 L110,5 L113,6 L118,3 L120,4 L122,5 L127,2 L133,5 L137,5 L143,2 L148,2 L151,4 L153,4 L158,5 L164,5 L170,4 L175,3 L181,5 L185,2 L190,3 L193,5 L199,5 L202,5 L206,3 L210,5 L214,3 L216,3 L220,6 L223,2 L225,5 L227,4 L233,5 L237,6 L240,4 L240,0 Z' fill='black'/></svg>");
  /* type */
  --font-display: "Old Standard TT", "PT Serif", Georgia, serif;
  --font-body: "PT Serif", Georgia, "Times New Roman", serif;
  --font-type: "PT Mono", "Courier New", ui-monospace, monospace;
  --font-stamp: "Oswald", "Arial Narrow", Impact, sans-serif;
  /* motion */
  --ease: cubic-bezier(.2, .7, .2, 1);
  --t-fast: 140ms;
  --t-med: 240ms;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.55;
  background:
    radial-gradient(70% 55% at 50% 10%, var(--lamp) 0%, transparent 70%),
    radial-gradient(120% 80% at 50% 100%, rgba(30, 70, 90, .35) 0%, transparent 60%),
    linear-gradient(180deg, var(--night-2) 0%, var(--night) 100%);
  background-color: var(--night);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 18px;
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { max-width: 1320px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }

/* ---------- controls ---------- */
input, textarea, select {
  font: inherit; font-family: var(--font-type); font-size: .92rem; color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--ink-3); border-radius: 0; padding: 6px 2px; width: 100%;
}
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: .85; }
input[type="file"] { border-bottom: 0; padding: 4px 0; font-size: .82rem; }
input[type="checkbox"] { width: 18px; height: 18px; padding: 0; accent-color: var(--blue); flex: none; margin: 3px 0 0; }
textarea {
  resize: vertical; min-height: 96px; border: 1px solid var(--rule); padding: 6px 10px; line-height: 28px;
  background: repeating-linear-gradient(transparent 0 27px, var(--line-blue) 27px 28px); background-attachment: local;
}
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
label { display: grid; gap: 2px; font-family: var(--font-type); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
label.check { display: flex; gap: 8px; align-items: flex-start; font-family: var(--font-body); font-size: .92rem; text-transform: none; letter-spacing: 0; color: var(--ink); }
button { font: inherit; cursor: pointer; color: inherit; }
.btn {
  font-family: var(--font-type); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
  border-radius: 3px; padding: 7px 14px; border: 1.5px solid var(--ink-2); background: transparent; color: var(--ink);
  transition: background-color var(--t-fast) ease-out, color var(--t-fast) ease-out;
}
.btn:hover { background-color: rgba(60, 45, 20, .08); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.primary:hover { background: #3a3329; }
.btn.light { background: var(--paper); border-color: var(--paper); color: var(--ink); }
.btn.light:hover { background: #fff; }
.btn.ghost { border-color: transparent; color: var(--ink-2); padding: 4px 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn:disabled { opacity: .45; cursor: default; }
.link { border: 0; background: transparent; color: var(--blue); padding: 0; font-family: var(--font-type); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.x { border: 0; background: transparent; color: var(--ink-2); padding: 0 7px; font-size: .85rem; line-height: 1.6; border-radius: 3px; transition: background-color var(--t-fast) ease-out; }
.x:hover { background: rgba(60, 45, 20, .1); color: var(--ink); }
.x.danger { color: var(--red); font-family: var(--font-type); font-size: .75rem; text-transform: uppercase; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.row.start { justify-content: flex-start; }
.notice { color: var(--ink-3); font-size: .9rem; font-style: italic; }
.err { color: var(--red); font-size: .85rem; font-family: var(--font-type); }
.err:empty { display: none; }
.grid2, .grid3 { display: grid; gap: 14px 18px; }
.grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* ---------- folder tabs ---------- */
.toolbar { flex: none; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; justify-content: space-between; }
.toolbar > .btn { margin-bottom: 8px; }
.tabs { display: flex; gap: 4px; padding-left: 14px; }
.tabs button {
  position: relative; border: 1px solid var(--manila-edge); border-bottom: 0; border-radius: 10px 10px 0 0;
  padding: 9px 22px 8px; margin-bottom: -1px; transform: translateY(3px);
  font-family: var(--font-type); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; color: #3d3220;
  background: var(--noise), var(--manila-2);
  transition: transform var(--t-med) var(--ease), background-color var(--t-med) ease-out, color var(--t-med) ease-out;
}
.tabs button:hover { transform: translateY(1px); }
.tabs button[aria-selected="true"] { z-index: 2; transform: translateY(0); padding-top: 12px; color: var(--ink); background: var(--noise), var(--manila); }
.tabs .count { font-size: .75rem; margin-left: 6px; color: var(--ink-3); }

/* ---------- folder ---------- */
.folder {
  flex: 1 1 auto; min-height: 0; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px;
  padding: 16px 18px; border: 1px solid var(--manila-edge); border-radius: 4px 12px 12px 12px;
  background:
    radial-gradient(circle at 92% 88%, transparent 34px, rgba(110, 62, 18, .2) 36px, rgba(110, 62, 18, .1) 39px, transparent 43px),
    radial-gradient(40% 30% at 18% 22%, rgba(255, 240, 200, .35), transparent 70%),
    radial-gradient(35% 28% at 70% 12%, rgba(150, 100, 40, .18), transparent 70%),
    radial-gradient(30% 40% at 40% 85%, rgba(140, 95, 35, .2), transparent 70%),
    radial-gradient(25% 25% at 85% 45%, rgba(255, 235, 190, .25), transparent 70%),
    radial-gradient(22% 18% at 55% 55%, rgba(120, 80, 25, .12), transparent 70%),
    repeating-linear-gradient(176deg, rgba(120, 80, 30, .035) 0 2px, transparent 2px 7px),
    var(--noise), var(--manila);
  box-shadow: inset 0 0 0 1px rgba(255, 240, 200, .25), inset 0 0 70px rgba(90, 52, 8, .45), 0 26px 60px rgba(0, 0, 0, .65);
}
.view { flex: 1 1 auto; min-height: 0; }
.view.enter { animation: view-in var(--t-med) var(--ease) both; }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* blanks (add forms) */
.blank {
  flex: none; max-height: 48%; overflow: auto; display: grid; gap: 14px; padding: 18px;
  background: var(--noise), var(--paper); box-shadow: 0 6px 16px rgba(60, 40, 10, .22);
}
.blank-title { font-family: var(--font-type); font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); border-bottom: 3px double var(--ink-2); padding-bottom: 8px; }
.inline-form { display: grid; gap: 14px; padding: 16px; border: 1.5px dashed var(--ink-3); background: var(--paper-2); }

/* ---------- people view ---------- */
.layout { display: grid; grid-template-columns: 280px minmax(0, 1fr) 56px; height: 100%; }

/* roster: index cards */
.roster { min-height: 0; overflow: auto; display: grid; gap: 8px; align-content: start; padding: 2px 18px 12px 2px; margin-right: 6px; }
.roster > input { position: sticky; top: 0; z-index: 3; background: var(--noise), var(--paper); border: 0; padding: 10px 12px; box-shadow: 0 2px 6px rgba(60, 40, 10, .18); margin-bottom: 4px; }
.people { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.person-btn {
  width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 10px; align-items: center;
  text-align: left; border: 0; border-top: 3px solid #e2a59b; border-radius: 2px; padding: 10px 12px; color: var(--ink);
  background: var(--noise), var(--paper);
  box-shadow: 0 1px 0 rgba(0, 0, 0, .06), 0 3px 8px rgba(60, 40, 10, .18);
  transition: transform var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease);
}
.person-btn:hover { transform: translateX(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, .06), 0 6px 12px rgba(60, 40, 10, .24); }
.person-btn[aria-current="true"] { transform: translateX(10px); box-shadow: -6px 0 0 var(--red), 0 6px 14px rgba(60, 40, 10, .28); }
.person-btn .avatar { grid-row: span 3; }
.p-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-role { color: var(--ink-2); font-size: .85rem; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-rate { font-family: var(--font-type); font-size: .8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.p-due { margin-left: 6px; font-family: var(--font-stamp); text-transform: uppercase; letter-spacing: .08em; font-size: .66rem; color: var(--red); }
.avatar { width: 40px; height: 48px; display: block; overflow: hidden; border: 2px solid #f4f1e8; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); background: #4b3f8f; }
.avatar svg, .photo svg { width: 100%; height: 100%; display: block; }
.empty { color: var(--ink-3); padding: 18px 8px; text-align: center; font-style: italic; }
.roster .empty { background: var(--noise), var(--paper); box-shadow: 0 3px 8px rgba(60, 40, 10, .18); }

/* sheet: cardboard backing + small paper stack */
.sheet-card {
  position: relative; z-index: 3; min-height: 0; height: 100%; padding: 12px 14px 16px 12px; border-radius: 9px; border: 1px solid var(--card-edge);
  background:
    radial-gradient(50% 40% at 25% 15%, rgba(255, 235, 190, .22), transparent 70%),
    radial-gradient(40% 35% at 80% 75%, rgba(90, 55, 15, .22), transparent 70%),
    repeating-linear-gradient(4deg, rgba(90, 55, 15, .05) 0 1px, transparent 1px 5px),
    var(--noise), linear-gradient(170deg, var(--card), var(--card-2));
  box-shadow: inset 0 0 0 2px rgba(255, 235, 190, .18), inset 0 0 22px rgba(70, 40, 8, .45), 0 10px 22px rgba(30, 18, 4, .45);
}
.sheet-card::after {
  content: ""; position: absolute; top: -10px; right: 70px; width: 15px; height: 48px; z-index: 6; transform: rotate(8deg);
  border: 2px solid var(--clip); border-radius: 9px; background: linear-gradient(var(--clip), var(--clip)) 50% 9px / 2px 28px no-repeat;
}
.paper-stack { position: relative; height: 100%; }
.under { position: absolute; inset: 0; background: var(--noise), #efe6cf; box-shadow: 0 1px 3px rgba(60, 40, 10, .25); }
.under.u1 { transform: translate(5px, 5px) rotate(.5deg); }
.under.u2 { transform: translate(9px, 9px) rotate(-.4deg); background: var(--noise), #e6d9b9; }
.detail { position: relative; height: 100%; overflow: auto; overscroll-behavior: contain; box-shadow: 0 1px 3px rgba(40, 25, 5, .3); }
.page {
  min-height: 100%; padding: 30px 34px 44px; display: grid; gap: 22px; align-content: start; position: relative;
  background:
    radial-gradient(60% 40% at 80% 100%, rgba(170, 130, 60, .12), transparent 70%),
    radial-gradient(30% 20% at 10% 0%, rgba(170, 130, 60, .1), transparent 70%),
    var(--noise), var(--paper);
  -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 7px) no-repeat, var(--torn) bottom left / 240px 8px repeat-x;
          mask: linear-gradient(#000 0 0) top / 100% calc(100% - 7px) no-repeat, var(--torn) bottom left / 240px 8px repeat-x;
}
.page .body.enter { animation: view-in var(--t-med) var(--ease) both; }

/* dossier head */
.case { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 3px double var(--ink-2); }
.case-no { font-family: var(--font-type); font-size: .85rem; letter-spacing: .2em; text-transform: uppercase; display: inline-flex; align-items: center; }
.case-no b { font-weight: 400; font-size: 1.05rem; letter-spacing: .1em; margin-left: .4em; }
.ico { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 1.6; margin-right: 8px; }
.dossier { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 26px; align-items: start; }
.photo {
  position: relative; width: 104px; height: 130px; border: 6px solid #f4f1e8; border-bottom-width: 20px; background: #4b3f8f;
  box-shadow: 0 2px 4px rgba(60, 40, 10, .25); transform: rotate(-1.5deg);
}
.photo::after { content: "фото"; position: absolute; left: 0; right: 0; bottom: -17px; text-align: center; font-family: var(--font-type); font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
.photo::before {
  content: ""; position: absolute; top: -18px; left: 20px; width: 14px; height: 46px; z-index: 1;
  border: 2px solid var(--clip); border-radius: 8px; background: linear-gradient(var(--clip), var(--clip)) 50% 8px / 2px 26px no-repeat;
}
.fields { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin: 0; align-items: baseline; }
.fields dt { font-family: var(--font-type); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.fields dd { margin: 0; border-bottom: 1px dotted var(--ink-3); padding-bottom: 2px; min-width: 0; overflow-wrap: anywhere; }
.fields h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; margin: 0; line-height: 1.15; text-wrap: balance; }
.fields .money { font-family: var(--font-type); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.fields .money small { font-size: .85rem; color: var(--ink-2); }
.stamps { display: flex; flex-direction: column; gap: 14px; align-items: flex-end; padding-top: 6px; }
.stamp {
  display: inline-block; font-family: var(--font-stamp); font-weight: 600; text-transform: uppercase; letter-spacing: .12em;
  color: var(--red); border: 3px double var(--red); padding: 2px 12px; border-radius: 4px; transform: rotate(-7deg);
  opacity: .85; line-height: 1.3; white-space: nowrap;
}
.stamp.blue { color: var(--blue); border-color: var(--blue); transform: rotate(4deg); }
.badge { display: inline-block; font-family: var(--font-stamp); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; padding: 0 7px; border: 2px solid currentColor; border-radius: 3px; vertical-align: middle; transform: rotate(-3deg); }
.badge.example, .badge.due { color: var(--amber); }
.badge.late { color: var(--red); }
.badge.plain { color: var(--ink-3); }

/* bookmarks, tucked behind the sheet */
.ptabs { position: relative; z-index: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; margin-left: -24px; padding-top: 96px; }
.ptabs button {
  writing-mode: vertical-rl; text-orientation: mixed; display: block; width: 66px; padding: 18px 0 18px 26px; line-height: 40px; text-align: center;
  border: 1px solid rgba(10, 40, 42, .5); border-radius: 0 9px 9px 0;
  font-family: var(--font-type); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: #eef3ea; text-shadow: 0 1px 0 rgba(0, 0, 0, .25);
  box-shadow: 2px 3px 5px rgba(40, 25, 5, .3);
  transition: width var(--t-med) var(--ease), background-color var(--t-med) ease-out, color var(--t-med) ease-out;
}
.ptabs button:hover { width: 72px; }
.ptabs .pt-projects { background: var(--noise), var(--teal-1); }
.ptabs .pt-salary { background: var(--noise), var(--teal-2); }
.ptabs .pt-review { background: var(--noise), var(--teal-3); }
.ptabs .pt-notes { background: var(--noise), var(--teal-4); }
.ptabs button[aria-selected="true"] { width: 76px; background: var(--noise), var(--teal-lite); color: #102a2c; text-shadow: none; font-weight: 700; box-shadow: 2px 3px 6px rgba(20, 12, 2, .4); }
.ptabs .count { margin-top: 6px; font-size: .7rem; letter-spacing: 0; color: #cfe3e0; }
.ptabs button[aria-selected="true"] .count { color: #1e4446; }

/* sections */
section { display: grid; gap: 14px; min-width: 0; }
section h3 { font-family: var(--font-type); font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 400; margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
section h3 .notice { text-transform: none; letter-spacing: 0; }

/* cork + pinned cards */
.cork {
  position: relative; padding: 28px 22px 26px; border: 10px solid var(--cork-frame); border-radius: 3px;
  background: var(--cork-tex), radial-gradient(80% 70% at 50% 30%, #b98653, var(--cork) 70%, #8c5f37);
  box-shadow: inset 0 0 26px rgba(40, 20, 5, .55), 0 4px 10px rgba(0, 0, 0, .35);
}
.cork-legend { position: absolute; right: 12px; bottom: 6px; font-family: var(--font-type); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 240, 215, .8); pointer-events: none; }
.cork-empty { color: #fff2dc; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); font-style: italic; }
.pin {
  position: absolute; top: 7px; left: 50%; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; z-index: 2;
  background: radial-gradient(circle at 35% 30%, #ff8a7c 0%, var(--pin) 45%, #6e100c 100%); box-shadow: 2px 3px 3px rgba(0, 0, 0, .45);
}
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; }
.tile-wrap { position: relative; min-width: 0; display: grid; transform: rotate(var(--rot, 0deg)); transition: transform var(--t-med) var(--ease); }
.tile-wrap:hover { transform: rotate(0deg) translateY(-2px); }
.tile-wrap > .x { position: absolute; top: 2px; right: 2px; z-index: 3; }
.tile {
  width: 100%; min-width: 0; display: grid; justify-items: center; align-content: start; gap: 8px; padding: 26px 10px 14px;
  text-align: center; border: 0; border-radius: 1px; color: var(--ink); background: var(--noise), var(--paper);
  box-shadow: 0 2px 0 rgba(0, 0, 0, .08), 3px 8px 14px rgba(30, 15, 0, .45);
  transition: box-shadow var(--t-med) var(--ease);
}
.tile:hover { box-shadow: 0 2px 0 rgba(0, 0, 0, .08), 4px 12px 18px rgba(30, 15, 0, .5); }
.tile[aria-current="true"] { box-shadow: 0 0 0 2px var(--ink), 4px 12px 18px rgba(30, 15, 0, .5); }
.tile .name { font-weight: 700; font-size: .92rem; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .meta { font-size: .78rem; color: var(--ink-2); font-style: italic; overflow-wrap: anywhere; }
.tile .meta.missing { color: var(--amber); }
.label {
  width: 58px; height: 58px; border-radius: 4px; display: grid; place-items: center; overflow: hidden; flex: none;
  font-family: var(--font-stamp); font-weight: 600; font-size: 1.05rem; letter-spacing: .04em;
  border: 2.5px solid currentColor; box-shadow: inset 0 0 0 2px var(--paper);
}
.label.lg { width: 84px; height: 84px; font-size: 1.5rem; }
.label.has-img { border: 1px solid var(--rule); box-shadow: none; }
.label img { width: 100%; height: 100%; object-fit: cover; display: block; }
.c0 { background: var(--l0-bg); color: var(--l0-fg); }
.c1 { background: var(--l1-bg); color: var(--l1-fg); }
.c2 { background: var(--l2-bg); color: var(--l2-fg); }
.c3 { background: var(--l3-bg); color: var(--l3-fg); }
.c4 { background: var(--l4-bg); color: var(--l4-fg); }
.c5 { background: var(--l5-bg); color: var(--l5-fg); }

.picker { display: grid; gap: 14px; padding: 16px; border: 1.5px dashed var(--ink-3); background: var(--paper-2); }
.picker-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.picker-head input { flex: 1 1 200px; width: auto; }
.picker .pgrid .tile { box-shadow: 0 2px 6px rgba(60, 40, 10, .2); padding-top: 16px; }

/* work memo */
.work {
  display: grid; gap: 14px; padding: 22px 22px 22px 46px; position: relative;
  background: linear-gradient(#e2a59b, #e2a59b) 32px 0 / 1px 100% no-repeat, var(--noise), var(--paper-2);
  box-shadow: 0 4px 12px rgba(60, 40, 10, .2);
}
.work-kicker { font-family: var(--font-type); font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
.work-head { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.work-title { display: flex; gap: 14px; align-items: center; min-width: 0; }
.work-title h4 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; overflow-wrap: anywhere; }
.work-title .m { color: var(--ink-2); font-family: var(--font-type); font-size: .82rem; }
.work-text { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch; line-height: 1.7; }
.work textarea { min-height: 160px; }

/* salary */
.sal-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1.5px solid var(--ink-2); background: var(--paper); }
.sal-sum > div { padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.sal-sum > div + div { border-left: 1px solid var(--rule); }
.sal-sum .k { font-family: var(--font-type); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.sal-sum .v { font-family: var(--font-type); font-size: 1.5rem; line-height: 1.25; font-variant-numeric: tabular-nums; }
.sal-sum .v small { font-size: .85rem; color: var(--ink-2); }
.sal-sum .v.up { color: var(--green); }
.sal-sum .v.down { color: var(--red); }
.sal-sum .n { font-size: .88rem; color: var(--ink-2); }
.bars { display: flex; gap: 14px; padding: 0 4px; overflow-x: auto; }
.bar { flex: 1 0 64px; max-width: 120px; display: grid; text-align: center; }
.track { height: 160px; display: flex; flex-direction: column; justify-content: flex-end; border-bottom: 2px solid var(--ink-2); background: repeating-linear-gradient(0deg, var(--rule) 0 1px, transparent 1px 40px); }
.bar .bv { font-family: var(--font-type); font-size: .82rem; padding-bottom: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar .bb { display: block; margin: 0 6px; background: #b9c4d6; border: 1.5px solid var(--blue); border-bottom: 0; }
.bar.now .bb { background: var(--blue); }
.bar.now .bv { font-weight: 700; }
.bar .bd { font-family: var(--font-type); font-size: .74rem; color: var(--ink-2); padding-top: 6px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.ev { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 6px 18px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.ev:first-child { border-top: 1px solid var(--rule); }
.ev-date { font-family: var(--font-type); font-size: .85rem; color: var(--ink-2); padding-top: 3px; }
.ev-body { display: grid; gap: 6px; min-width: 0; justify-items: start; }
.ev-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.ev-amt { font-family: var(--font-type); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.chg { font-size: .9rem; padding: 1px 8px; border-radius: 3px; background: var(--paper-2); color: var(--ink-2); }
.chg.up { background: #e1ecd9; color: var(--green); }
.chg.down { background: #f3dfd9; color: var(--red); }
.chg.start { background: transparent; color: var(--ink-3); font-style: italic; padding-left: 0; }
.args-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; padding: 12px; background: var(--paper-2); }
.args-grid b { font-family: var(--font-type); font-weight: 400; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.args-grid ul { margin: 4px 0 0; padding-left: 18px; font-size: .92rem; color: var(--note-ink); }

/* review: meta + sticky notes */
.review-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: end; padding: 16px; border: 1.5px solid var(--ink-2); background: var(--paper-2); }
.review-meta .sum { font-size: .88rem; color: var(--ink-2); display: grid; gap: 2px; }
.review-meta .sum b { color: var(--ink); font-family: var(--font-type); font-weight: 400; }
.board3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
.sticky { position: relative; display: grid; grid-template-rows: auto 1fr auto; min-width: 0; padding-top: 14px; background: var(--noise), var(--sticky-y); box-shadow: 2px 10px 14px rgba(30, 15, 0, .45); }
.sticky.plus { background: var(--noise), var(--sticky-g); transform: rotate(-.5deg); }
.sticky.minus { background: var(--noise), var(--sticky-p); transform: rotate(-.8deg); }
.sticky.fix { transform: rotate(.4deg); }
.sticky-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 8px; font-family: var(--font-stamp); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: .95rem; }
.sticky.plus .sticky-head { color: var(--green); }
.sticky.minus .sticky-head { color: var(--red); }
.sticky.fix .sticky-head { color: var(--amber); }
.sticky-head .n { font-family: var(--font-type); font-size: .8rem; color: var(--ink-2); font-weight: 400; letter-spacing: 0; }
.items { list-style: none; margin: 0; padding: 0 14px; display: grid; align-content: start; }
.item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px dashed rgba(0, 0, 0, .14); }
.item:first-child { border-top: 0; }
.item .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .95rem; line-height: 1.45; color: var(--note-ink); }
.item.done .t { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--ink-2); color: var(--ink-3); }
.item .d { display: block; font-family: var(--font-type); font-size: .68rem; color: var(--ink-3); }
.items .none { color: var(--ink-3); font-size: .9rem; font-style: italic; padding: 4px 0; }
.sticky form { display: flex; gap: 6px; padding: 10px 14px 12px; border-top: 1px dashed rgba(0, 0, 0, .2); background: rgba(255, 255, 255, .35); }
.sticky form input { padding: 4px 2px; font-size: .85rem; }
.sticky form .btn { padding: 4px 10px; }

/* notes as stickies */
.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; align-items: start; }
.note { position: relative; display: grid; gap: 4px; padding: 26px 16px 14px; background: var(--noise), var(--sticky-y); box-shadow: 2px 10px 14px rgba(30, 15, 0, .45); transform: rotate(var(--rot, 0deg)); }
.note .when { font-family: var(--font-type); font-size: .72rem; color: #6b5a2a; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.note .text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1rem; line-height: 1.55; color: var(--note-ink); }

/* ---------- projects view ---------- */
.base { height: 100%; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.base-head { flex: none; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: var(--noise), var(--paper); box-shadow: 0 3px 8px rgba(60, 40, 10, .18); }
.base-head input { flex: 1 1 220px; width: auto; }
.proj-card { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; padding: 18px 20px; border-top: 3px solid #e2a59b; background: var(--noise), var(--paper); box-shadow: 0 4px 12px rgba(60, 40, 10, .22); max-height: 46%; overflow: auto; }
.proj-card h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.proj-card .body { display: grid; gap: 12px; min-width: 0; align-content: start; }
.team { display: grid; border-top: 1px solid var(--rule); }
.team-row { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 8px 4px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; text-align: left; width: 100%; transition: background-color var(--t-fast) ease-out; }
.team-row:hover { background: var(--paper-2); }
.team-row .avatar { width: 32px; height: 38px; }
.team-row .nm { font-weight: 700; }
.team-row .rl { color: var(--ink-2); font-size: .85rem; font-style: italic; }
.team-row .tx { font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; color: var(--ink-2); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 30px; height: 30px; border-radius: 4px; padding: 0; border: 2.5px solid currentColor; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.filebtn { display: inline-flex; cursor: pointer; }
.filebtn span { font-family: var(--font-type); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; border: 1.5px solid var(--ink-2); border-radius: 3px; padding: 7px 14px; }
.label-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }

/* free-form board (drag like stickies) */
.board-wrap { flex: 1 1 auto; min-height: 260px; padding: 0; overflow: auto; }
.board { position: relative; min-height: 100%; }
.bcard {
  position: absolute; width: 168px; display: grid; justify-items: center; gap: 8px; padding: 26px 10px 14px; text-align: center;
  border: 0; border-radius: 1px; color: var(--ink); background: var(--noise), var(--paper);
  box-shadow: 0 2px 0 rgba(0, 0, 0, .08), 3px 8px 14px rgba(30, 15, 0, .45);
  transform: rotate(var(--rot, 0deg)); touch-action: none; user-select: none; cursor: grab;
  transition: transform var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease);
}
.bcard:hover { transform: rotate(0deg) translateY(-2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .08), 5px 14px 20px rgba(30, 15, 0, .5); }
.bcard[aria-current="true"] { box-shadow: 0 0 0 2px var(--ink), 5px 14px 20px rgba(30, 15, 0, .5); }
.bcard.dragging { cursor: grabbing; transform: rotate(0deg) scale(1.04); box-shadow: 0 2px 0 rgba(0, 0, 0, .08), 10px 24px 30px rgba(20, 10, 0, .55); transition: none; z-index: 9999 !important; }
.bcard.locked { cursor: pointer; }
.bcard .name { font-weight: 700; font-size: .92rem; line-height: 1.3; overflow-wrap: anywhere; }
.bcard .meta { font-size: .78rem; color: var(--ink-2); font-style: italic; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  html, body { height: auto; }
  .wrap, .layout, .base { height: auto; }
  .folder { flex: none; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .roster { overflow: visible; margin: 0 0 18px; padding-right: 2px; order: 1; }
  .roster > input { position: static; }
  .ptabs { order: 2; flex-direction: row; flex-wrap: wrap; margin: 0; padding: 0 0 0 10px; gap: 4px; align-items: flex-end; }
  .ptabs button { writing-mode: horizontal-tb; width: auto; padding: 8px 12px; line-height: 1.4; border-radius: 9px 9px 0 0; }
  .ptabs button:hover, .ptabs button[aria-selected="true"] { width: auto; }
  .ptabs button[aria-selected="true"] { padding-top: 11px; box-shadow: none; }
  .ptabs .count { margin: 0 0 0 6px; }
  .sheet-card { order: 3; height: auto; }
  .paper-stack, .detail { height: auto; }
  .detail { overflow: visible; }
  .board-wrap { min-height: 420px; max-height: 70vh; }
  .proj-card { max-height: none; }
}
@media (max-width: 680px) {
  .dossier { grid-template-columns: auto minmax(0, 1fr); }
  .stamps { grid-column: 1 / -1; flex-direction: row; }
  .sal-sum, .review-meta, .board3, .args-grid { grid-template-columns: minmax(0, 1fr); }
  .sal-sum > div + div { border-left: 0; border-top: 1px solid var(--rule); }
  .proj-card { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .folder { padding: 12px; }
  .page { padding: 22px 16px 32px; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .fields { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .fields dt { margin-top: 8px; }
  .ev { grid-template-columns: minmax(0, 1fr) auto; }
  .ev-date { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  .person-btn:hover, .tile-wrap:hover, .bcard:hover { transform: rotate(var(--rot, 0deg)); }
}
img { max-width: 100%; }
/* login + account bar */
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.acct { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

<div class="wrap">

/* Small adapter: the same db interface the app used inside claude.ai, backed by Firestore. */
const mapErr = (e) => {
  const c = e && e.code;
  if (c === "permission-denied" || c === "unauthenticated") return { code: "invalid_argument", message: e.message, denied: true };
  if (c === "resource-exhausted") return { code: "quota_exceeded", message: e.message };
  return { code: "unavailable", message: (e && e.message) || String(e) };
};
const isPlain = (v) => v !== null && typeof v === "object" && !Array.isArray(v) && Object.getPrototypeOf(v) === Object.prototype;
function flatten(obj, pre = [], out = []) {
  for (const [k, v] of Object.entries(obj)) { const p = [...pre, k]; if (isPlain(v) && Object.keys(v).length) flatten(v, p, out); else out.push([p, v]); }
  return out;
}
const docApi = (path) => {
  const ref = doc(fdb, path);
  return {
    id: path.split("/").pop(),
    update: (data) => { const args = flatten(data).flatMap(([p, v]) => [new FieldPath(...p), v]); return updateDoc(ref, ...args).catch((e) => { throw mapErr(e); }); },
    set: (data) => setDoc(ref, data).catch((e) => { throw mapErr(e); }),
    delete: () => deleteDoc(ref).catch((e) => { throw mapErr(e); }),
  };
};
const colApi = (path, cons = []) => ({
  orderBy: (f, d) => colApi(path, [...cons, orderBy(f, d || "asc")]),
  limit: (n) => colApi(path, [...cons, limit(n)]),
  onSnapshot: (next, err) => onSnapshot(query(collection(fdb, path), ...cons),
    (snap) => next({ docs: snap.docs.map((d) => ({ id: d.id, data: () => d.data() })) }),
    (e) => err && err(mapErr(e))),
  add: (data) => addDoc(collection(fdb, path), data).then((r) => ({ id: r.id })).catch((e) => { throw mapErr(e); }),
  doc: (id) => docApi(path + "/" + id),
});
const FB = { collection: (p) => colApi(p), doc: (p) => docApi(p) };

/* Project labels are stored as small images inside the project document. */
async function toIconData(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej({ code: "unsupported_type" }); i.src = url; });
    const N = 160, c = document.createElement("canvas"); c.width = N; c.height = N;
    const k = Math.max(N / img.naturalWidth, N / img.naturalHeight) || 1, w = img.naturalWidth * k, h = img.naturalHeight * k;
    c.getContext("2d").drawImage(img, (N - w) / 2, (N - h) / 2, w, h);
    let out = c.toDataURL("image/webp", 0.86);
    if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/png");
    return out;
  } finally { URL.revokeObjectURL(url); }
}

    const bg = BG[r(BG.length)], sk = SK[r(SK.length)], hr = HR[r(HR.length)], cl = CL[r(CL.length)];
    const longHair = r(2) === 0, bangs = r(2) === 0, glasses = r(4) === 0;
    const px = []; const P = (x, y, c) => px.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`);
    if (longHair) for (let y = 3; y <= 12; y++) { P(2, y, hr); P(9, y, hr); if (y >= 5) { P(1, y, hr); P(10, y, hr); } }
    for (let x = 1; x <= 10; x++) { P(x, 12, cl); P(x, 13, cl); }
    for (const x of [2, 3, 4, 7, 8, 9]) P(x, 11, cl);

  function boardLayout(list, width) {
    const cols = Math.max(1, Math.floor((width - PAD * 2 + GAP_X) / (CARD_W + GAP_X)));
    const slot = new Map(S.projects.map((x, i) => [x.id, i])); /* stable home slot: other cards never jump when one is moved */
    let maxY = 0, maxX = 0;
    const out = list.map((x) => {
      const saved = S.localPos[x.id] || x.pos;
      let px, py, z = 0;
      if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) { px = saved.x; py = saved.y; z = saved.z || 0; }
      else { const i = slot.get(x.id) || 0; px = PAD + (i % cols) * (CARD_W + GAP_X); py = PAD + Math.floor(i / cols) * (CARD_H + GAP_Y); }
      maxY = Math.max(maxY, py + CARD_H); maxX = Math.max(maxX, px + CARD_W);
      return { x, px, py, z };
    });
    return { cards: out, h: maxY + PAD + 20, w: maxX + PAD };
  }

    S.animate.view = false; S.animate.body = false;
    if (f) { const el = $(f.id); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch {} } }

    const name = $("npr-name").value.trim();
    if (!name) { $("npr-err").textContent = "Вкажіть назву проєкту."; $("npr-name").focus(); return; }
    const btn = $("npr-submit"); btn.disabled = true; $("npr-err").textContent = "";
    try {
      const data = { name, color: S.newColor, createdAt: new Date().toISOString() };
      if (S.newFile) data.iconData = await toIconData(S.newFile);
      const ref = await S.db.collection("projects").add(data);
      S.selProject = ref.id; S.pui = {};
      resetProjectForm(); $("addProjectForm").hidden = true; render();
    } catch (err) { $("npr-err").textContent = failText(err); }
    finally { btn.disabled = false; }
  });

  /* ================= roster & bookmarks events ================= */
  $("search").addEventListener("input", (e) => { S.q = e.target.value; renderPeople(); });
  $("people").addEventListener("click", (e) => { const b = e.target.closest(".person-btn"); if (b) select(b.dataset.id); });
  $("ptabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) setPtab(b.dataset.tab); });

  /* ================= person writes ================= */
  async function saveRate(p, entry, attachReview) {
    let h = historyOf(p);
    if (!h.length) h = [{ id: uid(), date: p.since || (p.createdAt ? String(p.createdAt).slice(0, 7) : thisMonth()), rate: Number(p.rate) || 0, currency: p.currency || "PLN", note: "Початкова ЗП" }];
    h = h.filter((x) => x.date !== entry.date || x.id === entry.id).concat(entry).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    const latest = h[h.length - 1];
    const patch = { rateHistory: h, rate: latest.rate, currency: latest.currency };
    if (attachReview) patch.nextReview = { date: "", target: 0 };
    await S.db.doc("people/" + p.id).update(patch);
    if (attachReview) for (const r of reviewOf(p)) await S.db.doc("reviews/" + r.id).update({ raiseId: entry.id });
  }
  const RAISE_FIELDS = ["ra-rate", "ra-cur", "ra-date", "ra-note", "ra-attach"];

  const detailActions = {
    "open-link": () => { S.ui = { linking: true }; S.linkQ = ""; render(); const i = $("link-q"); if (i) i.focus(); },
    "close-link": () => { S.ui = {}; render(); },
    "go-projects": () => openAddProject(),
    "open-work": (b) => { const id = b.dataset.id; S.ui = S.ui.work === id && !S.ui.editWork ? {} : { work: id }; render(); const w = $("workPanel"); if (w) w.scrollIntoView({ behavior: "smooth", block: "nearest" }); },
    "close-work": () => { S.ui = {}; render(); },
    "edit-work": () => { clearDrafts("wk-role", "wk-period", "wk-text"); S.ui = { work: S.ui.work, editWork: true }; render(); const t = $("wk-text"); if (t) t.focus(); },
    "cancel-work": () => { S.ui = { work: S.ui.work }; render(); },
    "open-raise": () => { clearDrafts(...RAISE_FIELDS); S.ui = { raise: true }; render(); const i = $("ra-rate"); if (i) i.focus(); },
    "open-raise-review": () => { clearDrafts(...RAISE_FIELDS); S.ui = { raiseFromReview: true }; render(); const i = $("ra-rate"); if (i) i.focus(); },
    "cancel-raise": () => { S.ui = {}; render(); },
    "toggle-args": (b) => { S.ui = { openRaise: S.ui.openRaise === b.dataset.id ? null : b.dataset.id }; render(); },
    "link": async (b, p) => { try { await S.db.doc("people/" + p.id).update({ projectIds: [...linkedIds(p), b.dataset.id] }); } catch (err) { showErr("link-err", err); } },
    "unlink": async (b, p) => { try { await S.db.doc("people/" + p.id).update({ projectIds: linkedIds(p).filter((x) => x !== b.dataset.id) }); } catch (err) { showErr("link-err", err); } },
    "toggle-fix": async (b) => { try { await S.db.doc("reviews/" + b.dataset.id).update({ done: b.checked }); } catch (err) { b.checked = !b.checked; showErr("rv-err", err); } },
    "del-item": async (b) => { try { await S.db.doc("reviews/" + b.dataset.id).delete(); } catch (err) { showErr("rv-err", err); } },
    "del-rate": async (b, p) => {
      const id = b.dataset.id;
      if (S.ui.confirmRate !== id) { S.ui = { confirmRate: id }; render(); return; }
      const h = historyOf(p).filter((x) => x.id !== id); const patch = { rateHistory: h };
      if (h.length) { patch.rate = h[h.length - 1].rate; patch.currency = h[h.length - 1].currency; }
      try {
        await S.db.doc("people/" + p.id).update(patch);
        for (const r of S.reviews.filter((r) => r.raiseId === id)) await S.db.doc("reviews/" + r.id).update({ raiseId: null });
        S.ui = {}; render();
      } catch (err) { showErr("hist-err", err); }
    },
    "del-person": async (b, p) => {
      if (!S.ui.confirmDel) { S.ui = { confirmDel: true }; render(); return; }
      try {
        for (const c of notesOf(p)) await S.db.doc("comments/" + c.id).delete();
        for (const r of S.reviews.filter((r) => r.personId === p.id)) await S.db.doc("reviews/" + r.id).delete();
        await S.db.doc("people/" + p.id).delete(); S.selected = null; S.ui = {}; render();
      } catch (err) { b.textContent = failText(err); }
    },
    "del-note": async (b) => {
      const id = b.dataset.id;
      if (S.ui.confirmNote !== id) { S.ui = { confirmNote: id }; render(); return; }
      try { await S.db.doc("comments/" + id).delete(); S.ui = {}; } catch (err) { b.textContent = failText(err); }
    },
  };
  $("detail").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return; const p = person(); if (!p) return;
    const fn = detailActions[b.dataset.act]; if (fn) fn(b, p);
  });
  $("detail").addEventListener("input", (e) => { if (e.target.id === "link-q") { S.linkQ = e.target.value; render(); } });
  $("detail").addEventListener("change", async (e) => {
    const t = e.target; const p = person(); if (!p || !S.db) return;
    if (t.id !== "rv-next" && t.id !== "rv-target") return;
    const nr = Object.assign({ date: "", target: 0 }, p.nextReview || {});
    if (t.id === "rv-next") nr.date = t.value || ""; else nr.target = Number(String(t.value).replace(/\s/g, "").replace(",", ".")) || 0;
    try { await S.db.doc("people/" + p.id).update({ nextReview: nr }); } catch (err) { showErr("rv-err", err); }
  });
  $("detail").addEventListener("submit", async (e) => {
    e.preventDefault(); const p = person(); if (!p || !S.db) return;
    const f = e.target;
    if (f.id === "raiseForm") {
      const date = $("ra-date").value; if (mIndex(date) == null) { $("ra-err").textContent = "Вкажіть місяць у форматі РРРР-ММ."; return; }
      const rateRaw = $("ra-rate").value.trim().replace(/\s/g, "").replace(",", ".");
      if (rateRaw === "" || !Number.isFinite(Number(rateRaw)) || Number(rateRaw) < 0) { $("ra-err").textContent = "Вкажіть ЗП на місяць числом."; return; }
      const entry = { id: uid(), date, rate: Number(rateRaw), currency: $("ra-cur").value, note: $("ra-note").value.trim() };
      const attach = !!($("ra-attach") && $("ra-attach").checked);
      const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
      try {
        await saveRate(p, entry, attach); clearDrafts(...RAISE_FIELDS);
        S.ui = attach ? { openRaise: entry.id } : {}; if (attach) { S.ptab = "salary"; S.animate.body = true; } render();
      } catch (err) { showErr("ra-err", err); btn.disabled = false; }
    } else if (f.classList.contains("add-item")) {
      const kind = f.dataset.kind; const input = $("rv-add-" + kind); const text = input.value.trim(); if (!text) return;
      try {
        await S.db.collection("reviews").add({ personId: p.id, kind, text, done: false, createdAt: new Date().toISOString() });
        clearDrafts("rv-add-" + kind); input.value = ""; render(); const i = $("rv-add-" + kind); if (i) i.focus();
      } catch (err) { showErr("rv-err", err); }
    } else if (f.id === "workForm") {
      const pid = S.ui.work; if (!pid) return;
      const entry = { role: $("wk-role").value.trim(), period: $("wk-period").value.trim(), text: $("wk-text").value.trim(), updatedAt: new Date().toISOString() };
      const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
      try { await S.db.doc("people/" + p.id).update({ work: { [pid]: entry } }); clearDrafts("wk-role", "wk-period", "wk-text"); S.ui = { work: pid }; render(); }
      catch (err) { showErr("wk-err", err); btn.disabled = false; }
    } else if (f.id === "noteForm") {
      const text = $("note-text").value.trim(); if (!text) return;
      const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
      try { await S.db.collection("comments").add({ personId: p.id, text, createdAt: new Date().toISOString() }); clearDrafts("note-text"); render(); }
      catch (err) { showErr("note-err", err); btn.disabled = false; }
    }
  });

  /* ================= projects view events ================= */
  const projectActions = {
    "open-person": (b) => { setTab("people"); S.ptab = "projects"; select(b.dataset.id); if (b.dataset.proj) { S.ui = { work: b.dataset.proj }; render(); const w = $("workPanel"); if (w) w.scrollIntoView({ behavior: "smooth", block: "nearest" }); } },
    "close-project": () => { S.selProject = null; S.pui = {}; render(); },
    "rename": () => { clearDrafts("rn-name"); S.pui = { rename: true }; render(); const i = $("rn-name"); if (i) i.focus(); },
    "cancel-rename": () => { S.pui = {}; render(); },
    "recolor": async (b, sel) => { try { await S.db.doc("projects/" + sel.id).update({ color: Number(b.dataset.c) }); } catch (err) { showErr("pc-err", err); } },
    "drop-icon": async (b, sel) => { try { await S.db.doc("projects/" + sel.id).update({ iconId: null, iconData: null }); } catch (err) { showErr("pc-err", err); } },
    "del-project": async (b, sel) => {
      if (!S.pui.confirmDel) { S.pui = { confirmDel: true }; render(); return; }
      try {
        for (const p of peopleOn(sel.id)) await S.db.doc("people/" + p.id).update({ projectIds: (p.projectIds || []).filter((x) => x !== sel.id) });
        await S.db.doc("projects/" + sel.id).delete();
        S.selProject = null; S.pui = {}; render();
      } catch (err) { showErr("pc-err", err); }
    },
  };
  $("view-projects").addEventListener("click", (e) => {
    const card = e.target.closest(".bcard");
    if (card) { if (S.justDragged) return; S.selProject = S.selProject === card.dataset.id ? null : card.dataset.id; S.pui = {}; render(); return; }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const fn = projectActions[b.dataset.act]; if (!fn) return;
    const sel = projById(S.selProject);
    if (["open-person", "close-project"].includes(b.dataset.act) || sel) fn(b, sel);
  });
  $("view-projects").addEventListener("input", (e) => { if (e.target.id === "pq") { S.pq = e.target.value; render(); } });
  $("view-projects").addEventListener("change", async (e) => {
    if (e.target.id !== "re-file") return;
    const sel = projById(S.selProject); const f = e.target.files && e.target.files[0];
    if (!sel || !f || !S.assets) return;
    try { await S.db.doc("projects/" + sel.id).update({ iconData: await toIconData(f), iconId: null }); } catch (err) { showErr("pc-err", err); }
  });
  $("view-projects").addEventListener("submit", async (e) => {
    e.preventDefault(); const sel = projById(S.selProject); if (!sel || e.target.id !== "renameForm") return;
    const name = $("rn-name").value.trim(); if (!name) return;
    try { await S.db.doc("projects/" + sel.id).update({ name }); clearDrafts("rn-name"); S.pui = {}; render(); } catch (err) { showErr("pc-err", err); }
  });

  /* ================= drag cards on the board ================= */
  const topZ = () => Math.max(0, ...S.projects.map((x) => (S.localPos[x.id] || x.pos || {}).z || 0));
  async function savePos(id, pos) {
    S.localPos[id] = pos;
    try { await S.db.doc("projects/" + id).update({ pos }); } catch (err) { /* keep local position for this visit */ }
  }
  $("view-projects").addEventListener("pointerdown", (e) => {
    const card = e.target.closest(".bcard"); if (!card || !S.canWrite || !S.db || e.button !== 0) return;
    S.drag = { id: card.dataset.id, el: card, sx: e.clientX, sy: e.clientY, ox: card.offsetLeft, oy: card.offsetTop, moved: false, pointer: e.pointerId };
  });
  window.addEventListener("pointermove", (e) => {
    const d = S.drag; if (!d || e.pointerId !== d.pointer) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if (!d.moved) {
      if (Math.hypot(dx, dy) < 5) return;
      d.moved = true; d.el.classList.add("dragging");
      try { d.el.setPointerCapture(d.pointer); } catch {}
    }
    e.preventDefault();
    d.x = Math.max(0, d.ox + dx); d.y = Math.max(0, d.oy + dy);
    d.el.style.left = d.x + "px"; d.el.style.top = d.y + "px";
    const board = $("board");
    if (board) {
      const needH = d.y + CARD_H + PAD + 20, needW = d.x + CARD_W + PAD;
      if (needH > board.offsetHeight) board.style.height = needH + "px";
      if (needW > board.offsetWidth) board.style.minWidth = needW + "px";
    }
  }, { passive: false });
  const endDrag = (e) => {
    const d = S.drag; if (!d || (e && e.pointerId !== d.pointer)) return;
    S.drag = null;
    if (d.moved) {
      S.justDragged = true; setTimeout(() => { S.justDragged = false; }, 0);
      d.el.classList.remove("dragging");
      const pos = { x: Math.round(d.x), y: Math.round(d.y), z: topZ() + 1 };
      d.el.style.zIndex = pos.z;
      savePos(d.id, pos);
    }
    if (S.renderPending) { S.renderPending = false; render(); }
  };
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  $("view-projects").addEventListener("keydown", (e) => {
    const card = e.target.closest && e.target.closest(".bcard"); if (!card || !S.canWrite) return;
    const step = e.shiftKey ? 40 : 10; const dirs = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    const mv = dirs[e.key]; if (!mv) return; e.preventDefault();
    const pos = { x: Math.max(0, card.offsetLeft + mv[0]), y: Math.max(0, card.offsetTop + mv[1]), z: topZ() + 1 };
    card.style.left = pos.x + "px"; card.style.top = pos.y + "px"; card.style.zIndex = pos.z;
    clearTimeout(S.keyMoveT); S.localPos[card.dataset.id] = pos;
    S.keyMoveT = setTimeout(() => savePos(card.dataset.id, pos), 400);
  });
  window.addEventListener("resize", () => { if (S.tab === "projects") { clearTimeout(S.resizeT); S.resizeT = setTimeout(render, 150); } });

  /* ================= data (Firebase) ================= */
  S.unsubs = [];
  function stopData() { S.unsubs.forEach((u) => { try { u(); } catch {} }); S.unsubs = []; }
  function startData() {
    const got = { people: false, projects: false };
    const mark = (k) => { got[k] = true; if (got.people && got.projects) S.loaded = true; };
    const onErr = (k) => (e) => { if (e && e.denied) S.denied = true; if (k) mark(k); render(); };
    S.unsubs.push(S.db.collection("people").orderBy("name").onSnapshot((snap) => {
      S.people = snap.docs.map((d) => ({ id: d.id, ...d.data() })); mark("people");
      if (!S.selected && S.people.length && !window.matchMedia("(max-width: 860px)").matches) S.selected = S.people[0].id;
      if (S.selected && !S.people.some((p) => p.id === S.selected)) S.selected = null;
      render();
    }, onErr("people")));
    S.unsubs.push(S.db.collection("projects").orderBy("name").onSnapshot((snap) => {
      S.projects = snap.docs.map((d) => ({ id: d.id, ...d.data() })); mark("projects");
      for (const x of S.projects) { const l = S.localPos[x.id]; if (l && x.pos && x.pos.x === l.x && x.pos.y === l.y) delete S.localPos[x.id]; }
      if (S.selProject && !projById(S.selProject)) S.selProject = null;
      render();
    }, onErr("projects")));
    S.unsubs.push(S.db.collection("comments").orderBy("createdAt", "desc").limit(1000).onSnapshot((snap) => { S.comments = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, onErr()));
    S.unsubs.push(S.db.collection("reviews").orderBy("createdAt").limit(1000).onSnapshot((snap) => { S.reviews = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, onErr()));
  }
  function showLogin(on) {
    $("login").hidden = !on;
    document.querySelector(".tabs").style.visibility = on ? "hidden" : "visible";
    $("acct").hidden = on; $("addBtn").hidden = on;
    if (on) { $("view-people").hidden = true; $("view-projects").hidden = true; $("addPersonForm").hidden = true; $("addProjectForm").hidden = true; }
    else setTab(S.tab);
  }
  const toast = (t) => { $("toast").textContent = t; clearTimeout(S.toastT); S.toastT = setTimeout(() => { $("toast").textContent = ""; }, 4000); };

  $("loginBtn").addEventListener("click", async () => {
    $("login-err").textContent = "";
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) {
      const c = e && e.code;
      $("login-err").textContent =
        c === "auth/unauthorized-domain" ? `Домен ${location.hostname} не додано у Firebase → Authentication → Settings → Authorized domains.` :
        c === "auth/popup-blocked" ? "Браузер заблокував вікно входу. Дозвольте спливаючі вікна для цього сайту." :
        c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request" ? "Вхід скасовано." :
        c === "auth/operation-not-allowed" ? "Вхід через Google не увімкнено у Firebase → Authentication → Sign-in method." :
        location.protocol === "file:" ? "Вхід не працює з файлу на диску. Відкрийте сайт через GitHub Pages." :
        "Не вдалося увійти: " + ((e && e.message) || c || "невідома помилка");
    }
  });
  $("logoutBtn").addEventListener("click", () => signOut(auth));

  $("exportBtn").addEventListener("click", () => {
    const strip = (arr) => arr.map((x) => ({ ...x }));
    const data = { exportedAt: new Date().toISOString(), app: "Портфоліо команди",
      collections: { people: strip(S.people), projects: strip(S.projects), comments: strip(S.comments), reviews: strip(S.reviews) } };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "portfolio-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("Експортовано");
  });
  $("importFile").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    try {
      const json = JSON.parse(await f.text()); const cols = json.collections || json;
      const ops = [];
      for (const name of ["people", "projects", "comments", "reviews"]) for (const item of (cols[name] || [])) {
        if (!item || !item.id) continue; const { id, ...rest } = item; delete rest.iconId; ops.push([name + "/" + id, rest]);
      }
      if (!ops.length) { toast("У файлі немає записів"); return; }
      for (let k = 0; k < ops.length; k += 400) {
        const b = writeBatch(fdb);
        for (const [p, d] of ops.slice(k, k + 400)) b.set(doc(fdb, p), d);
        await b.commit();
      }
      toast(`Імпортовано записів: ${ops.length}`);
    } catch (err) { toast(err && err.code === "permission-denied" ? "Немає прав на запис" : "Не вдалося імпортувати файл"); }
  });

  onAuthStateChanged(auth, (u) => {
    stopData();
    Object.assign(S, { user: u, people: [], projects: [], comments: [], reviews: [], selected: null, selProject: null, loaded: false, denied: false, ui: {}, pui: {}, drafts: {} });
    if (!u) { S.db = null; showLogin(true); return; }
    $("acct-email").textContent = u.email || "";
    S.db = FB; S.assets = {}; S.canWrite = true;
    showLogin(false);
    startData();
    render();
  });

  renderNewProjectPreview();
  if (location.hash === "#projects") S.tab = "projects";
})();
</script>
</body>
</html>
